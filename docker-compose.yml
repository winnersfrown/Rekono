services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rekono
      POSTGRES_PASSWORD: rekono
      POSTGRES_DB: rekono
    volumes:
      - rekono_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://rekono:rekono@db:5432/rekono
      STORAGE_DIR: /data/storage
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - rekono_storage:/data/storage
    ports:
      - "8000:8000"

volumes:
  rekono_pgdata:
  rekono_storage:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Rekono</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --ink-950: #f4f7fd;
    --ink-900: #ffffff;
    --line: #d8e0f2;
    --paper: #101a33;
    --muted: #5b6b8c;
    --blue: #4b86f7;
    --blue-bright: #2f6fe0;
    --shadow-sm: 0 1px 2px rgba(16, 26, 51, 0.05), 0 3px 8px -4px rgba(16, 26, 51, 0.08);
    --shadow-glow: 0 8px 24px -6px rgba(75, 134, 247, 0.35);
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink-950);
    color: var(--paper);
    font-family: var(--font-body);
    text-align: center;
    padding: 24px;
  }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.3rem;
    text-decoration: none;
    color: var(--paper);
    margin-bottom: 40px;
  }
  .mark {
    width: 20px; height: 20px;
    border: 1.6px solid var(--blue-bright);
    border-radius: 3px;
    position: relative;
    flex: none;
  }
  .mark::after {
    content: "";
    position: absolute;
    left: 3px; right: 3px; top: 46%;
    height: 1.6px;
    background: var(--blue-bright);
    box-shadow: 0 -6px 0 -5px var(--blue-bright), 0 6px 0 -5px var(--blue-bright);
  }
  .code { font-size: 0.85rem; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 0 12px; }
  p { color: var(--muted); max-width: 32rem; margin: 0 auto 32px; line-height: 1.5; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 10px 20px;
    border-radius: 7px;
    text-decoration: none;
    background: linear-gradient(180deg, #5f97ff, var(--blue));
    color: #04081a;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover { box-shadow: var(--shadow-glow); transform: translateY(-1.5px); }
</style>
</head>
<body>
  <div>
    <a href="/Rekono/" class="wordmark"><span class="mark"></span>Rekono</a>
    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <p>The link might be old, or the page may have moved. Head back to the homepage to find what you're looking for.</p>
    <a href="/Rekono/" class="btn">Back to Rekono →</a>
  </div>
</body>
</html>

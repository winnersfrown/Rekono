<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Rekono</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f7fd">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /* Standalone page: the app's own stylesheet never loads here, so the
     tokens are repeated inline. Keep them in step with DESIGN.md and
     website/src/index.css. */
  @font-face {
    font-family: "Bitter";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("/fonts/bitter-600.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("/fonts/ibm-plex-sans-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
  }
  :root {
    --paper: #f4f7fd;
    --ink: #101a33;
    --ink-soft: #3b4964;
    --muted: #5b6b8c;
    --rule: #d8e0f2;
    --accent: #4b86f7;
    --accent-deep: #1d4ed8;
    --font-display: "Bitter", Georgia, "Times New Roman", serif;
    --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    padding: 32px 28px;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { max-width: 46rem; margin: 0 auto; width: 100%; }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    text-decoration: none;
    color: var(--ink);
    margin-bottom: 64px;
  }
  .mark { width: 24px; height: 24px; flex: none; }
  .code {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
    display: block;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: -0.015em;
    font-size: clamp(1.8rem, 4.5vw, 2.6rem);
    line-height: 1.14;
    margin: 24px 0 16px;
  }
  p { color: var(--ink-soft); max-width: 34rem; margin: 0 0 32px; }
  .btn {
    display: inline-flex;
    align-items: center;
    font-weight: 500;
    font-size: 0.9rem;
    padding: 12px 28px;
    border: 1px solid var(--accent);
    border-radius: 5px;
    text-decoration: none;
    background: var(--accent);
    color: var(--ink);
    transition: background-color 140ms cubic-bezier(0.22, 1, 0.36, 1), border-color 140ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .btn:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="sheet">
    <a href="/" class="wordmark"><img src="/favicon.svg" alt="" class="mark">Rekono</a>
    <span class="code">Error 404</span>
    <h1>This page doesn't exist.</h1>
    <p>The link might be old, or the page may have moved. Head back to the homepage to find what you're looking for.</p>
    <a href="/" class="btn">Back to Rekono</a>
  </div>
</body>
</html>

# Render Blueprint for Rekono -- a one-click way to stand up a real,
# publicly-reachable instance (backend + Postgres) instead of running it
# only locally / via docker-compose.
#
# Deploy: push this repo to your own GitHub account (or fork it), then in
# Render go to New -> Blueprint and point it at the repo. Render reads this
# file and provisions everything below under your own Render account --
# nothing here requires credentials from anyone but you.
#
# Free tier, on purpose. Two tradeoffs that come with it:
#   1. The database is Render's free Postgres, which auto-deletes after 30
#      days of the *plan*, not of inactivity -- you'll need to recreate it
#      (or upgrade to "starter") before then if you want to keep the data.
#   2. Free web services can't attach a persistent disk, so uploaded
#      invoice files live in the container's ephemeral filesystem and are
#      lost on every restart/redeploy/spin-down. The database (extracted
#      data, audit trail) is unaffected -- only the original source files
#      (needed for the review UI's document preview) don't survive. On
#      restart the app notices any invoice a lost job left mid-pipeline and
#      resolves it -- normally if the file happened to survive, otherwise
#      failed with a clear "please re-upload this document" message -- so it
#      never sits stuck on "processing" forever, but the source file/preview
#      for anything uploaded before a restart is still gone for good. Set
#      SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY below to avoid this entirely --
#      uploads move to Supabase Storage's free tier instead, which persists
#      across restarts. See README.md's "Persistent file storage (Supabase)"
#      section.
#   3. Free web services spin down after 15 minutes of no requests and
#      cold-start (10-30s) on the next one. A request that lands right as
#      the service is spinning down mid-extraction gets recovered on the
#      next boot per point 2 above, rather than lost.
# Bump both `plan:` values below to `starter` if these stop being
# acceptable tradeoffs.
databases:
  - name: rekono-db
    plan: free
    databaseName: rekono
    user: rekono

services:
  - type: web
    name: rekono-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rekono-db
          property: connectionString
      - key: STORAGE_DIR
        value: /tmp/storage # ephemeral on the free plan -- see note above
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard after deploy -- optional, enables LLM extraction instead of the heuristic fallback
      - key: RESEND_API_KEY
        sync: false # optional -- enables the marketing site's contact form
      - key: STRIPE_SECRET_KEY
        sync: false # optional -- enables paid plans (Free plan and everything else work without it)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # optional, pairs with STRIPE_SECRET_KEY -- see README's "Plans & billing (Stripe)" section
      - key: GOOGLE_CLIENT_ID
        sync: false # optional -- enables "Sign in with Google" (email/password works without it)
      - key: GOOGLE_CLIENT_SECRET
        sync: false # optional, pairs with GOOGLE_CLIENT_ID -- see README's "Sign in with Google" section
      - key: QUICKBOOKS_CLIENT_ID
        sync: false # optional -- enables the Settings tab's QuickBooks integration
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false # optional, pairs with QUICKBOOKS_CLIENT_ID -- see README's "QuickBooks Online (Phase 1)" section
      - key: SUPABASE_URL
        sync: false # optional -- enables persistent invoice file storage, see note on point 2 above
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # optional, pairs with SUPABASE_URL -- see README's "Persistent file storage (Supabase)" section
      - key: SUPABASE_STORAGE_BUCKET
        value: invoices

# Render Blueprint for Rekono -- a one-click way to stand up a real,
# publicly-reachable instance (backend + Postgres) instead of running it
# only locally / via docker-compose.
#
# Deploy: push this repo to your own GitHub account (or fork it), then in
# Render go to New -> Blueprint and point it at the repo. Render reads this
# file and provisions everything below under your own Render account --
# nothing here requires credentials from anyone but you.
#
# Free tier, on purpose. Two tradeoffs that come with it:
#   1. Free web services can't attach a persistent disk, so uploaded
#      invoice files live in the container's ephemeral filesystem and are
#      lost on every restart/redeploy/spin-down. The database (extracted
#      data, audit trail) is unaffected -- only the original source files
#      (needed for the review UI's document preview) don't survive. On
#      restart the app notices any invoice a lost job left mid-pipeline and
#      resolves it -- normally if the file happened to survive, otherwise
#      failed with a clear "please re-upload this document" message -- so it
#      never sits stuck on "processing" forever, but the source file/preview
#      for anything uploaded before a restart is still gone for good.
#      Setting AWS_S3_BUCKET below removes this tradeoff entirely, even on
#      this single free instance -- see README's "Scaling past one
#      instance" section.
#   2. Free web services spin down after 15 minutes of no requests and
#      cold-start (10-30s) on the next one. A request that lands right as
#      the service is spinning down mid-extraction gets recovered on the
#      next boot per point 1 above, rather than lost.
# Bump `plan:` below to `starter` if these stop being acceptable tradeoffs.
#
# Database: this Blueprint does NOT provision Render's own Postgres --
# Render's free Postgres auto-deletes after 30 days of the *plan*, not of
# inactivity. DATABASE_URL instead points at an external Postgres, e.g. a
# free Neon project (neon.tech), which persists indefinitely (idle databases
# scale to zero, not delete). Create a Neon project, copy its connection
# string, and set DATABASE_URL manually in the Render dashboard after this
# Blueprint deploys. See README.md's "Database (Neon)" section.

services:
  - type: web
    name: rekono-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard after deploy -- your Neon (or other Postgres) connection string, see note above
      - key: STORAGE_DIR
        value: /tmp/storage # ephemeral on the free plan -- see note above
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard after deploy -- optional, enables LLM extraction instead of the heuristic fallback
      # Alternative to Gemini: OpenRouter needs BOTH of these, and the model
      # must support tool calling. See README's "LLM provider" section.
      - key: OPENROUTER_API_KEY
        sync: false # optional -- alternative LLM provider, set alongside OPENROUTER_MODEL
      - key: OPENROUTER_MODEL
        sync: false # required with OPENROUTER_API_KEY -- the exact slug, e.g. "vendor/model-name"
      - key: RESEND_API_KEY
        sync: false # optional -- enables the marketing site's contact form
      - key: STRIPE_SECRET_KEY
        sync: false # optional -- enables paid plans (Free plan and everything else work without it)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # optional, pairs with STRIPE_SECRET_KEY -- see README's "Plans & billing (Stripe)" section
      - key: GOOGLE_CLIENT_ID
        sync: false # optional -- enables "Sign in with Google" (email/password works without it)
      - key: GOOGLE_CLIENT_SECRET
        sync: false # optional, pairs with GOOGLE_CLIENT_ID -- see README's "Sign in with Google" section
      - key: QUICKBOOKS_CLIENT_ID
        sync: false # optional -- enables the Settings tab's QuickBooks integration
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false # optional, pairs with QUICKBOOKS_CLIENT_ID -- see README's "QuickBooks Online (Phase 1)" section
      # Optional escape hatch for both this plan's ephemeral-disk problem
      # (point 1 above) and running more than one instance -- see README's
      # "Scaling past one instance (AWS S3 + SQS)" section. Leave unset to
      # keep today's local-disk/in-process-queue behavior; set AWS_S3_BUCKET
      # alone to stop losing uploaded files on restart even on this single
      # free instance, or set both to actually scale to more than one.
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_SQS_QUEUE_URL
        sync: false

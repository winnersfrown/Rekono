# Render Blueprint for Rekono -- a one-click way to stand up a real,
# publicly-reachable instance (backend + Postgres) instead of running it
# only locally / via docker-compose.
#
# Deploy: push this repo to your own GitHub account (or fork it), then in
# Render go to New -> Blueprint and point it at the repo. Render reads this
# file and provisions everything below under your own Render account --
# nothing here requires credentials from anyone but you.
#
# Free tier, on purpose. Two tradeoffs that come with it:
#   1. The database is Render's free Postgres, which auto-deletes after 30
#      days of the *plan*, not of inactivity -- you'll need to recreate it
#      (or upgrade to "starter") before then if you want to keep the data.
#   2. Free web services can't attach a persistent disk, so uploaded
#      invoice files live in the container's ephemeral filesystem and are
#      lost on every restart/redeploy/spin-down. The database (extracted
#      data, audit trail) is unaffected -- only the original source files
#      (needed for the review UI's document preview) don't survive.
#   3. Free web services spin down after 15 minutes of no requests and
#      cold-start (10-30s) on the next one. In the unlikely case a request
#      lands right as the service is spinning down mid-extraction, that
#      job could be interrupted -- rare in practice since any request
#      resets the idle timer, but worth knowing.
# Bump both `plan:` values below to `starter` if these stop being
# acceptable tradeoffs.
databases:
  - name: rekono-db
    plan: free
    databaseName: rekono
    user: rekono

services:
  - type: web
    name: rekono-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rekono-db
          property: connectionString
      - key: STORAGE_DIR
        value: /tmp/storage # ephemeral on the free plan -- see note above
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard after deploy -- optional, enables LLM extraction instead of the heuristic fallback
